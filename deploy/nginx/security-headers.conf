# ==============================================================================
# Enterprise Security Headers Configuration (OWASP Standard)
# Alpha School Website Management Platform
# ==============================================================================

# 1. Prevent Clickjacking - Ensure site cannot be embedded in unauthorized iframes
add_header X-Frame-Options "SAMEORIGIN" always;

# 2. Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# 3. HTTP Strict Transport Security (HSTS) - 2 years + subdomains + preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 4. Referrer Policy - Send full URL for same-origin, domain-only for cross-origin HTTPS, none for HTTP
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 5. XSS Protection Filter
add_header X-XSS-Protection "1; mode=block" always;

# 6. Permissions Policy - Disable unnecessary hardware APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

# 7. Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.google.com; object-src 'none'; base-uri 'self';" always;
