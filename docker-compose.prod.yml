version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_cms_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_production_pass_2026}
      POSTGRES_DB: ${DB_NAME:-school_cms_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups
    command: >
      postgres
      -c shared_buffers=1024MB
      -c effective_cache_size=3072MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=4GB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: school_cms_prod_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_production_pass_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_secure_production_pass_2026}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: school_cms_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_production_pass_2026}@postgres:5432/${DB_NAME:-school_cms_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_production_pass_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-enterprise_jwt_super_secret_key_production_2026_at_least_64_bytes_long}
      HMAC_SECRET: ${HMAC_SECRET:-enterprise_hmac_sha256_webhook_and_preview_secret_key_2026_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://school.edu.vn,https://admin.school.edu.vn}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: school_cms_prod_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://school.edu.vn}
    depends_on:
      - api
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: school_cms_prod_admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${ADMIN_SITE_URL:-https://admin.school.edu.vn}
    depends_on:
      - api
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: school_cms_prod_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - web
      - admin
      - api
    networks:
      - internal_network
      - public_network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 5s
      retries: 3

  db-backup:
    image: postgres:16-alpine
    container_name: school_cms_prod_backup
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_production_pass_2026}
      POSTGRES_DB: ${DB_NAME:-school_cms_prod}
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
    volumes:
      - backup_data:/backups
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '-c', 'while true; do /bin/sh /usr/local/bin/backup.sh; sleep 86400; done']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network

volumes:
  postgres_data:
    name: school_cms_prod_postgres_data
  redis_data:
    name: school_cms_prod_redis_data
  backup_data:
    name: school_cms_prod_backup_data
  nginx_logs:
    name: school_cms_prod_nginx_logs
  ssl_certs:
    name: school_cms_prod_ssl_certs

networks:
  internal_network:
    driver: bridge
    internal: true
  public_network:
    driver: bridge
